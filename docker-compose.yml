version: '3.8'

services:
  telegram-forwarder:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegram_support_forwarder
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
